spring:
  application:
    name: state-machine-api

  h2:
    console:
      enabled: true
      path: /h2

  jpa:
    properties:
      hibernate:
        show_sql: true
  #        format_sql: true

  datasource:
    url: jdbc:h2:mem:szs;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

server:
  port: 8080
